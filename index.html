<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   
<meta
  name="description"
  content="Discover Gabrielle Essence Eau De Parfum by CHANEL. Explore this elegant fragrance and its special price."
/>

      <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500,700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
   
   <title>product-preview-card-component</title>
  </head>

  <body class="bg-cream min-h-screen
    flex justify-center items-center">

<main class="w-full max-w-[850px] 
 rounded-lg bg-white m-8 lg:flex ">

<picture class="w-full lg:w-1/2">
    <source
      media="(min-width: 1024px)"
      srcset="images/image-product-desktop.jpg"
          width="600"
    height="900"
  
    />

    <img
      class="w-full h-full object-cover rounded-t-lg
      lg:rounded-t-none lg:rounded-l-lg"
      src="images/image-product-mobile.jpg"
      alt="Gabrielle Chanel perfume bottle"
          width="700"
    height="684"
    />
  </picture>


  <article class="px-6 py-6 lg:w-1/2">

<p class=" uppercase tracking-widest
font-montserrat font-medium 
text-sm text-gray mt-5">Perfume</p>

<h1 class="mt-5 text-3xl font-fraunces font-bold
text-black "> Gabrielle Essence Eau De Parfum</h1>

 <p class="mt-5 font-montserrat font-medium
tracking-tight text-sm text-gray">  A floral, solar and voluptuous interpretation composed by Olivier Polge, 
  Perfumer-Creator for the House of CHANEL.
</p>



<div class="mt-7 flex items-center gap-3 ">
  <span class="text-3xl font-montserrat font-bold
  text-green-500"
  >$149.99</span>

<del class="line-through text-gray"> $169.99</del>
</div>

<button
  type="button"
  class="bg-green-500 mt-5 w-full
  rounded-md text-white py-3
  flex justify-center items-center gap-3
  font-montserrat font-bold
  lg:mt-8

  hover:bg-green-700
  hover:cursor-pointer

  focus-visible:outline-none
  focus-visible:ring-2
  focus-visible:ring-black
  focus-visible:ring-offset-2

  transition
  active:scale-95

  motion-reduce:transition-none
  motion-reduce:transform-none"
>
  <img
    class="w-4"
    src="images/icon-cart.svg"
    alt=""
      
  />
  Add to Cart
</button>


 </article>

  </main>
   
<script type="module" src="/src/main.js"></script>
  </body>
</html>
